# Publishes server.json to the official MCP registry as one.commentify/commentify.
# Ownership of commentify.one is proven by its DNS TXT record and the private
# key in the repository secret MCP_REGISTRY_DNS_KEY (README, Publishing).
# Runs on a version tag (v1.2.0 sets version 1.2.0) or by hand.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Set version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      # A manual run after a release would publish the same version again,
      # which the registry refuses; skip it and leave the listing as it is.
      - name: Check whether this version is already listed
        id: listed
        run: |
          VERSION=$(jq -r .version server.json)
          if curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers/one.commentify%2Fcommentify/versions/$VERSION" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "one.commentify/commentify $VERSION is already listed; nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with the commentify.one DNS record
        if: steps.listed.outputs.already == 'false'
        run: ./mcp-publisher login dns --domain commentify.one --private-key "$MCP_REGISTRY_DNS_KEY"
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}

      - name: Publish
        if: steps.listed.outputs.already == 'false'
        run: ./mcp-publisher publish
